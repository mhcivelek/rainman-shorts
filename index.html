<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAINMAN SHORTS</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body>
<header><div id="roleBadge" class="roleBadge">Misafir</div><a href="#home" class="brand">RAINMAN <b>SHORTS</b></a><nav><button data-page="home">Ana Sayfa</button><button data-page="categories">Kategoriler</button><button data-page="upload">Video Yükle</button><button data-page="profile">Profil</button><button data-page="admin" id="adminNav" class="hide">Admin</button></nav><div><button id="loginBtn">Giriş</button><button id="registerBtn" class="primary">Kayıt Ol</button><button id="logoutBtn" class="hide">Çıkış</button></div></header>
<div id="globalMessage" class="globalMessage"></div><main>
<section id="home" class="page active"><div class="hero"><div><small>SHORTS VIDEO PLATFORM</small><h1>Videoları keşfet.<br><span>Hikâyeni paylaş.</span></h1><p>RAINMAN SHORTS'ta kısa videoları keşfet, yükle ve topluluğa katıl.</p><button class="primary big" data-page="upload">+ Video Yükle</button></div><div class="heroCard">▶<small>SHORTS</small></div></div><div class="head"><h2>Shorts</h2><span id="feedStatus"></span></div><div id="shortsFeed" class="grid"></div></section>
<section id="categories" class="page"><div class="head"><h2>Kategoriler</h2></div><div id="categoryGrid" class="cats"></div><div id="categoryVideos" class="grid"></div></section>
<section id="upload" class="page"><div class="panel narrow"><h2>Video Yükle</h2><p class="muted">MP4/WebM/MOV · maksimum 100 MB</p><form id="uploadForm"><label>Başlık<input id="videoTitle" maxlength="120" required></label><label>Açıklama<textarea id="videoDescription" maxlength="1000"></textarea></label><label>Kategori<select id="videoCategory" required></select></label><label>Video<input id="videoFile" type="file" accept="video/mp4,video/webm,video/quicktime" required></label><div id="fileInfo" class="muted"></div><video id="uploadPreview" class="preview hide" controls playsinline></video><div class="progress"><div id="progressBar"></div></div><label class="check"><input id="safeContent" type="checkbox" required> +18/sexual, çıplaklık veya pornografik içerik olmadığını onaylıyorum.</label><button id="uploadButton" class="primary big" type="submit">Videoyu Yükle</button><div id="uploadMessage"></div></form></div></section>
<section id="profile" class="page"><div id="profileBox" class="panel"></div><div class="head"><h2>Videolarım</h2></div><div id="myVideos" class="grid"></div></section>
<section id="admin" class="page"><div class="head"><h2>Admin Paneli</h2><span>Onay bekleyenler</span></div><div id="adminVideos" class="grid"></div></section></main>
<div id="authModal" class="modal hide"><div class="modalCard"><button id="closeAuth" class="close">×</button><div class="tabs"><button id="tabLogin" class="active">Giriş</button><button id="tabRegister">Kayıt</button></div><form id="authForm"><label id="usernameWrap" class="hide">Kullanıcı adı<input id="authUsername" maxlength="30"></label><label>E-posta<input id="authEmail" type="email" required></label><label>Şifre<input id="authPassword" type="password" minlength="8" required></label><button class="primary big" id="authSubmit">Giriş Yap</button><div id="authMessage"></div></form></div></div><script src="config.js"></script><script src="app.js"></script></body></html>
